version: '3.8'

services:
  crestfall:
    build: .
    container_name: crestfall-backend
    ports:
      - "8000:8000"
    volumes:
      - ./new_data:/app/new_data
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    environment:
      - PORT=8000
      - CRESTFALL_RELOAD=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
