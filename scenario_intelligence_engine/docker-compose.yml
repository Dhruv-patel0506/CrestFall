services:
  crestfall:
    build: .
    container_name: crestfall-backend
    ports:
      - "8000:8000"
    volumes:
      - ./new_data:/app/new_data
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    environment:
      - PORT=8000
      - CRESTFALL_RELOAD=0
    healthcheck:
      # python:3.13-slim has no curl, so the old curl check always reported "unhealthy"
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
